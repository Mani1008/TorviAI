[package]
name = "ai-assistant"
version = "0.1.0"
description = "A privacy-first AI assistant desktop application"
edition = "2021"

[lib]
name = "ai_assistant_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", default-features = false, features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = "0.25"
xcap = "0.0.14"
hound = "3.5"
dotenvy = "0.15"
percent-encoding = "2"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
regex = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.19"
winapi = { version = "0.3", features = ["winuser"] }
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
